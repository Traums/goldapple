spring:
  application:
    name: goldapple
  datasource:
    url: jdbc:postgresql://localhost:5432/goldapple
    username: goldapple
    password: goldapple
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jackson:
    time-zone: UTC

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  packages-to-scan: com.example.goldapple.controller
