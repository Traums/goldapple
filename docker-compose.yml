services:
  postgres:
    image: postgres:16-alpine
    container_name: goldapple-postgres
    environment:
      POSTGRES_DB: goldapple
      POSTGRES_USER: goldapple
      POSTGRES_PASSWORD: goldapple
    ports:
      - "5432:5432"
    volumes:
      - goldapple-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goldapple -d goldapple"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  goldapple-pg:
